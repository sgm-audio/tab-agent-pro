# Pinned dependency set for the *deployed* image.
#
# Scope and rationale
# -------------------
# `requirements.txt` is the declared, resolver-facing dependency list. That list
# is deliberately installed in two steps (see Dockerfile / CI) because
# basic-pitch declares `tensorflow` on Linux even though the code uses the ONNX
# backend — installing it for real would add ~1 GB and pull in a tree of
# packages (tensorflow -> keras -> pillow -> protobuf) that this project never
# imports. Resolvers therefore report CVEs in packages that are NOT in the
# image; see SECURITY.md for that accepted-risk reasoning.
#
# This file is the lock for what we actually install and ship. It is checked in
# by tools/check_lockfile.py, which regenerates the list from a clean
# environment and fails when it drifts.
#
# Regenerate:
#   python tools/check_lockfile.py --write
#
# Format: name==version, one per line, sorted. Applied with
#   pip install --no-deps -r requirements.lock
#
# NOTE: torch/torchaudio come from the CPU-only index:
#   pip install --index-url https://pypi.org/simple

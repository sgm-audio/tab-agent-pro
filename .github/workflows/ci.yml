name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    # --- Fast-fail: cheap lint/format checks first (~15s) ---
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip

    - name: Install lint tools
      run: pip install "ruff==0.11.5" "black==26.5.1"

    - name: Lint with Ruff
      run: ruff check .

    - name: Check formatting with Black
      run: black --check .

    # --- Heavy installs only after lint passes ---
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1 build-essential git

    - name: Install PyTorch CPU
      run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

    - name: Install project dependencies
      run: pip install -r requirements.txt

    - name: Install remaining dev dependencies
      run: pip install mypy pytest pytest-cov bandit

    - name: Type check with mypy
      continue-on-error: false
      run: mypy .

    - name: Run tests with coverage
      run: pytest tests/ -v --cov=. --cov-report=term-missing

    - name: Security scan with Bandit
      # Exclude tests/; B101 (assert) there is expected and noisy.
      run: bandit -r agents.py main.py app.py monitoring.py suno_postprocessor.py init_memory.py -x tests/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the Dockerfile (python:3.12-slim, both stages): the lock is
  # generated against the *shipped* interpreter, and 16 of its pins require
  # >=3.11, so testing on 3.10 cannot install the locked set at all.
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.11.5"
  BLACK_VERSION: "26.5.1"
  MYPY_VERSION: "2.4.0"
  BANDIT_VERSION: "1.9.4"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4
      with:
        # tools/check_index.py verifies the index.xml commit resolves; a shallow
        # clone of the tip is enough, but tags help when the pin is a tag.
        fetch-depth: 0

    # --- Fast-fail: cheap static checks first (~20s, no heavy installs) ---
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip

    - name: Install lint tools
      run: pip install "ruff==${RUFF_VERSION}" "black==${BLACK_VERSION}" "mypy==${MYPY_VERSION}" "bandit==${BANDIT_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"

    - name: Lint with Ruff
      run: ruff check .

    - name: Check formatting with Black
      run: black --check .

    # --- Repository guards (no third-party deps needed) ---
    - name: Validate ReaPack index (format + commit pin resolves)
      run: python tools/check_index.py

    - name: Check .env.example keys are honoured
      run: python tools/check_env_example.py

    - name: Check Docker install line
      run: python tools/check_docker_install.py

    - name: Check lockfile covers the shipped dependency set
      # Compares requirements.lock against the *declared* set; runs before the
      # heavy install so drift fails fast.
      run: python tools/check_lockfile.py --static

    # --- Security gates (fail the build, not just report) ---
    - name: Secret scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: false

    - name: Static security scan with Bandit
      # tests/ excluded; B101 (assert) there is expected and noisy.
      run: bandit -r . -x ./tests,./.git,./.venv -ll -f txt

    # --- Heavy installs only after the cheap gates pass ---
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsndfile1 build-essential git

    - name: Install PyTorch CPU
      run: pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu

    - name: Install project dependencies
      run: |
        # Match the Dockerfile: basic-pitch is installed with --no-deps because
        # its Linux default dependency set pulls TensorFlow, which the ONNX
        # backend does not use. mir_eval/resampy are its real runtime imports.
        pip install --no-deps "basic-pitch>=0.4.0,<0.5" "mir_eval>=0.6" "resampy>=0.2.2,<0.4.3"
        grep -v '^basic-pitch' requirements.txt > /tmp/req-nobp.txt
        pip install -r /tmp/req-nobp.txt

    - name: Enforce the locked versions
      # requirements.txt is range-based, so installing it can silently drift
      # from what was tested and what the image ships. Re-apply the lock with
      # --no-deps (already-satisfied packages are skipped, nothing is
      # re-resolved, and TensorFlow cannot sneak back in).
      run: pip install --no-deps -r requirements.lock

    - name: Install remaining dev dependencies
      run: pip install pytest pytest-cov lupa

    - name: Check every pin installs on this interpreter
      # A lock generated on a different Python can be silently uninstallable
      # here; this fails in seconds with the offending pins instead of surfacing
      # as a resolution error mid-install.
      run: python tools/check_lockfile.py --interpreter

    - name: Verify lockfile matches the installed environment
      # Tooling installed *after* this step (pytest, mypy, pip-audit, ruff...)
      # is intentionally not shipped, so it is ignored explicitly (--extra).
      # Both requirements.txt and pyproject.toml use ranges, so this compares
      # the dependency *closure* of the declared set rather than raw equality:
      # an exact-equality check can never pass against a range-based install.
      run: |
        python tools/check_lockfile.py --verify --extra pytest --extra pytest-cov

    - name: Dependency vulnerability scan (shipped set)
      # Audits the *installed environment*, i.e. what the image actually ships.
      # Scanning requirements.txt would instead report the TensorFlow tree that
      # basic-pitch declares but this project deliberately does not install.
      # Accepted, documented exceptions live in .pip-audit-ignore.
      # pip-audit has no ignore-file flag, so tools/check_vulns.py runs the
      # audit and enforces .pip-audit-ignore (reason + expiry per advisory).
      run: python tools/check_vulns.py

    - name: Type check with mypy
      run: mypy .

    - name: Run tests with coverage
      run: pytest tests/ -v --cov=. --cov-report=term-missing

    - name: Failure-mode simulations
      run: python tools/simulate_failures.py

    # Proves the shipped Docker install line produces a working backend.
    - name: Smoke test transcription backend
      run: |
        python - <<'PY'
        import agents
        assert agents.BASIC_PITCH_AVAILABLE, "Basic Pitch is not importable"
        from basic_pitch.inference import predict  # noqa: F401  (imports mir_eval/resampy too)
        print("Basic Pitch importable via ONNX")
        PY

    - name: REAPER settings propagation
      run: python tools/check_reaper_settings.py

    - name: Run validation suite (quick)
      run: python validate.py --quick

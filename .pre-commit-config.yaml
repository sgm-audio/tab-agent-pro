# Keep hook versions in sync with .github/workflows/ci.yml (the CI job is the
# source of truth; these hooks must not disagree with it).
exclude: ^venv.*/|\.codegraph/|AUDIT\.md|PLAN\.md|\.coverage
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Use the same formatter the CI gate runs (black --check).
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - # Match pyproject.toml ([tool.mypy] strict_optional = true) and CI's `mypy .`
        id: mypy
        args: [--strict-optional, --ignore-missing-imports]
        additional_dependencies: [types-PyYAML]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-toml
